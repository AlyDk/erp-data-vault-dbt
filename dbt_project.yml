name: erp_data_vault
version: "1.0.0"
config-version: 2
profile: erp_data_vault

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  erp_data_vault:
    staging:
      +schema: staging
      +materialized: view
    raw_vault:
      +schema: raw_vault
      +materialized: incremental
    marts:
      +schema: marts
      +materialized: table

flags:
  send_anonymous_usage_stats: false
